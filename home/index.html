<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- this 'viewport' allows for CSS to make view reponsive and change width at different breakpoints -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Login Page</title>
  
  <!-- Bootstrap CSS link to use on page -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
 <style>
 
 
 
	  /* body image with fixed background to prevent scrolling */
      body {
      background-image: url('images/daisy.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
	  /* body to 100% of the viewport height */
      height: 100vh; 
      }



	  /* class to style login content, white transparent   background */
     .content-wrapper {
	  margin-top: 150px;
      background-color: rgba(255, 255, 255, 0.8); 
	  /* padding set to 20px */
      padding: 20px;
	  /*rounded corners to the white background */
      border-radius: 10px;
      }
	
	
  </style>
</head>
<body>

  <!-- container set to responsive -->
  <div class="container-fluid">
    <div class="row">
	
	 <!-- bootstrap grid size 4 in centre, 4 either side -->
      <div class="col-md-4 offset-md-4">
	  
	    <!-- wrapper for form styling -->
        <div class="content-wrapper">
          <h1 class="text-center">Please Login for Access</h1>
          <p></p>
		  
		  <!-- form with POST method, validate user input -->
          <form method="POST" action="/login" class="was-validated">
		  
		  <!-- class and label for username, size 3 columns -->
           <div class="mb-3">
              <label for="username" class="form-label">Username</label>
			  <!-- input type text required, with place holder -->
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
            </div>
			
			<!-- class and label for password, size 3 columns -->
            <div class="mb-3">
			  <!-- input type password required, with place holder -->
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
			
			<!-- submit button -->
            <button type="submit" class="btn btn-primary btn-block">Enter!</button>
          </form>
		  
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap JavaScript and jQuery in a bundle via CND -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
