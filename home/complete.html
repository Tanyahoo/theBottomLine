<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  
  <!-- this 'viewport' allows for CSS to make view reponsive and change width at different breakpoints -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Order page</title>
  
  <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
 <style>
 
 
 
	  /* set image as background to cover page, fixed to prevent scrolling*/
      body {
      background-image: url('images/cottonback.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
	  /* height of the body to 100% of the viewport */
      height: 100vh; 
      }



	  /* wrapper for content white background with 80% opacity */
     .content-wrapper {
      background-color: rgba(255, 255, 255, 0.85); 
	  /* padding to create space between text and white background */
      padding: 20px;
	  /* rounded corners to background */
      border-radius: 10px; 
      }
	
	
	
  </style>
</head>
<body>
  <!-- container set to fluid for responsive view -->
  <div class="container-fluid d-flex justify-content-center align-items-center h-100">
  
    <div class="row">
	 <!-- container row is 6 columns for content, spare 3 each side-->
      <div class="col-md-6 offset-md-3">
	  
	    <!-- wrapper for content to style -->
        <div class="content-wrapper">
		
			  <!-- header and paragraph content message centred -->
			  <h1 class="text-center">Completed!</h1>
			  <p class="text-center">Your order is complete! An invoice will be sent to your inbox shortly. Thank you for your valued custom. From all of us at <i>The Bottom Line, </i> we wish you many delightful wears out of your items. Looking forward to seeing you again!</p>
			  
			  <!-- button link to home page -->
			  <p><a href="home" class="btn btn-primary d-block mx-auto">Back to Home Page</a></p>
			  
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap JavaScript and jQuery in a bundle via CND -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
</body>
</html>
